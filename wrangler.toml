name = "ohshrt"
main = "src/index.js"
compatibility_date = "2024-11-01"

# The admin SPA in ./public is served as static assets; any path that does not
# match an asset falls through to the Worker (short-code redirects and /api/*).
[assets]
directory = "./public"

# Create a KV namespace with:
#   npx wrangler kv namespace create LINKS
# then replace the id below with the one it prints.
[[kv_namespaces]]
binding = "LINKS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
